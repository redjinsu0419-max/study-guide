<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 - AI 오답노트 & 문제 풀이</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0fdf4; color: #333; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; }
    .header { background: #16a34a; color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .content { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .hidden { display: none !important; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 14px; font-weight: 600; color: #374151; }
    input[type="text"], select, textarea { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; outline: none; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: #16a34a; }
    textarea { height: 100px; resize: none; }
    .btn { background: #16a34a; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn:hover { background: #15803d; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .image-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; border: 1px dashed #cbd5e1; display: none; }
    .result-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-top: 8px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .loading { text-align: center; color: #16a34a; font-weight: 600; padding: 20px; }
    .btn:disabled { opacity: .55; cursor: wait; }
    .image-status { min-height: 18px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body data-school="elementary" data-school-label="초등학교">
  <div class="container">
    <div class="header">
      <h1>🎓 초등 - AI 오답노트</h1>
      <p id="sub-header">초등 맞춤형 문제 풀이 + 복습 4문제 자동 출제</p>
    </div>

    <!-- 로그인 (이름 입력) 화면 -->
    <div id="screen-login" class="content">
      <div style="text-align: center; margin: 20px 0;">
        <span style="font-size: 60px;">✏️</span>
      </div>
      <div class="input-group">
        <label for="user-name">이름을 입력해 주세요</label>
        <input type="text" id="user-name" placeholder="예: 홍진수" autofocus>
      </div>
      <button class="btn" onclick="startApp()">시작하기</button>
    </div>

    <!-- 문제 풀이 화면 -->
    <div id="screen-main" class="content hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="badge" id="user-welcome">환영합니다!</span>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="logout()">로그아웃</button>
      </div>

      <div class="input-group">
        <label>학년 & 과목 선택</label>
        <div style="display: flex; gap: 8px;">
          <select id="grade">

<option value="초등학교 1학년">초등학교 1학년</option>
<option value="초등학교 2학년">초등학교 2학년</option>
<option value="초등학교 3학년">초등학교 3학년</option>
<option value="초등학교 4학년">초등학교 4학년</option>
<option value="초등학교 5학년">초등학교 5학년</option>
<option value="초등학교 6학년" selected>초등학교 6학년</option>

          </select>
          <select id="subject">

<option value="수학" selected>수학</option>
<option value="국어">국어</option>
<option value="과학">과학</option>
<option value="사회">사회</option>
<option value="영어">영어</option>
<option value="도덕">도덕</option>
<option value="기타">기타</option>

          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="problem-image">📷 틀린 문제 사진 첨부 (촬영/선택)</label>
        <input type="file" id="problem-image" accept="image/png,image/jpeg,image/webp" capture="environment" onchange="previewImage(event)">
        <img id="image-preview" class="image-preview" alt="문제 사진 미리보기">
        <p id="image-status" class="image-status">PNG, JPG, WebP · 최대 20MB</p>
      </div>

      <div class="input-group">
        <label for="problem-text">📝 추가 질문 또는 문제 내용</label>
        <textarea id="problem-text" placeholder="문제를 직접 적거나 궁금한 점을 입력해 주세요."></textarea>
      </div>

      <button id="solve-button" class="btn" onclick="solveProblem()">AI 풀이 & 복습 4문제 받기</button>

      <div id="loading" class="loading hidden">
        🤖 초등 전문 AI가 분석하고 있습니다...
      </div>

      <div id="result-box" class="hidden">
        <label>💡 풀이 및 복습 4문제 결과</label>
        <div id="result-text" class="result-card"></div>
      </div>
    </div>
  </div>

  <script type="text/plain" id="legacy-script">
    let fullDataUrlString = "";
    let rawBase64String = "";

    window.onload = function() {
      const savedName = localStorage.getItem('study_guide_name');
      const savedKey = localStorage.getItem('study_guide_api_key');
      if (savedKey) document.getElementById('api-key').value = savedKey;
      if (savedName) showMainScreen(savedName);
    };

    function saveApiKey() {
      const keyVal = document.getElementById('api-key').value.trim();
      if (!keyVal) { alert('API 키를 입력해 주세요.'); return; }
      localStorage.setItem('study_guide_api_key', keyVal);
      alert('API 키가 기기에 보관되었습니다!');
    }

    function startApp() {
      const nameInput = document.getElementById('user-name').value.trim();
      if (!nameInput) { alert('이름을 입력해 주세요.'); return; }
      localStorage.setItem('study_guide_name', nameInput);
      showMainScreen(nameInput);
    }

    function showMainScreen(name) {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-main').classList.remove('hidden');
      document.getElementById('user-welcome').innerText = `${name} 학생 환영합니다!`;
    }

    function logout() {
      localStorage.removeItem('study_guide_name');
      document.getElementById('screen-main').classList.add('hidden');
      document.getElementById('screen-login').classList.remove('hidden');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height, maxDim = 1024;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else { width = Math.round((width * maxDim) / height); height = maxDim; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('image-preview').src = resizedDataUrl;
          document.getElementById('image-preview').style.display = 'block';

          fullDataUrlString = resizedDataUrl;
          const commaIdx = resizedDataUrl.indexOf(',');
          if (commaIdx !== -1) {
            rawBase64String = resizedDataUrl.substring(commaIdx + 1).trim();
          } else {
            rawBase64String = resizedDataUrl.trim();
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function solveProblem() {
      const apiKey = document.getElementById('api-key').value.trim() || localStorage.getItem('study_guide_api_key');
      const grade = document.getElementById('grade').value;
      const subject = document.getElementById('subject').value;
      const problemText = document.getElementById('problem-text').value.trim();

      if (!apiKey) { alert('API 키를 입력 후 저장을 눌러주세요.'); return; }
      if (!fullDataUrlString && !problemText) { alert('문제 사진을 첨부하거나 텍스트를 입력해 주세요.'); return; }

      localStorage.setItem('study_guide_api_key', apiKey);
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('result-box').classList.add('hidden');

      const systemPrompt = `당신은 친절하고 다정한 초등학교 AI 선생님입니다. 대상: ${grade} ${subject} 과정.\n\n[요청 사항]\n다음 문제 사진 또는 질문을 분석하여 아래 4개 항목을 명확히 구분하여 작성해 주세요:\n\n1. 🎯 [정답 및 핵심 요약]\n   - 문제의 최종 정답을 명확히 제시해 주세요.\n\n2. 💡 [단계별 상세 풀이]\n   - 학생이 쉽게 이해할 수 있도록 풀이 과정을 차근차근 설명해 주세요.\n\n3. 📌 [핵심 개념 및 공식]\n   - 이 문제에 적용되는 핵심 개념, 공식, 주의 포인트를 정리해 주세요.\n\n4. 📝 [복습용 4문제]\n   - 실제 기출 문제 유형과 유사한 **유사 기출 2문제**와 **응용 예상 2문제** (총 4문제)를 새로 출제해 주세요.\n   - 각 문제 아래에는 [문제]와 [정답 및 상세 해설]을 함께 작성해 주세요.`;

      let resultText = "";
      let isSuccess = false;
      let lastErr = "";

      // 판단: 키가 gsk_로 시작하면 Groq API 사용, 아니면 Gemini API 사용
      if (apiKey.startsWith("gsk_")) {
        // Groq API 방식
        const userContent = [{ type: "text", text: systemPrompt }];
        if (problemText) userContent.push({ type: "text", text: `질문/문제: ${problemText}` });
        if (fullDataUrlString) userContent.push({ type: "image_url", image_url: { url: fullDataUrlString } });

        let targetModels = ["meta-llama/llama-4-scout-17b-16e-instruct", "llama-3.2-11b-vision-preview", "llama-3.2-90b-vision-preview", "llama-3.3-70b-versatile"];
        try {
          const modelsRes = await fetch("https://api.groq.com/openai/v1/models", { headers: { 'Authorization': `Bearer ${apiKey}` } });
          const modelsData = await modelsRes.json();
          if (modelsData.data && Array.isArray(modelsData.data)) {
            const foundVision = modelsData.data.map(m => m.id).filter(id => id.includes('vision') || id.includes('scout') || id.includes('llama-4'));
            if (foundVision.length > 0) targetModels = [...foundVision, ...targetModels];
          }
        } catch (e) {}

        for (const modelName of targetModels) {
          try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
              body: JSON.stringify({ model: modelName, messages: [{ role: "user", content: userContent }], temperature: 0.2 })
            });
            const data = await response.json();
            if (!data.error && data.choices?.[0]?.message?.content) {
              resultText = data.choices[0].message.content;
              isSuccess = true;
              break;
            } else if (data.error) {
              lastErr = data.error.message;
            }
          } catch (err) { lastErr = err.message; }
        }
      } else {
        // Google Gemini API 방식
        const partsArray = [{ text: systemPrompt }];
        if (problemText) partsArray.push({ text: `질문/문제: ${problemText}` });
        if (rawBase64String) partsArray.push({ inline_data: { mime_type: "image/jpeg", data: String(rawBase64String) } });

        const geminiModels = ["gemini-1.5-flash-latest", "gemini-2.0-flash", "gemini-1.5-flash-8b"];
        for (const mName of geminiModels) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${mName}:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: partsArray }] })
            });
            const data = await response.json();
            if (!data.error && data.candidates?.[0]?.content?.parts?.[0]?.text) {
              resultText = data.candidates[0].content.parts[0].text;
              isSuccess = true;
              break;
            } else if (data.error) {
              lastErr = data.error.message;
            }
          } catch (err) { lastErr = err.message; }
        }
      }

      document.getElementById('loading').classList.add('hidden');

      if (!isSuccess) {
        alert(`AI 오류가 발생했습니다: ${lastErr || "응답을 받지 못했습니다."}`);
        return;
      }

      document.getElementById('result-text').innerText = resultText;
      document.getElementById('result-box').classList.remove('hidden');
    }
  </script>
  <script src="../app.js"></script>
</body>
</html>
