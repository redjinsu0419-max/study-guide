<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공부 가이드 - AI 문제 풀이 & 4문제 복습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f7fb; color: #333; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; }
    .header { background: #2563eb; color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .content { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .hidden { display: none !important; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 14px; font-weight: 600; color: #4b5563; }
    input[type="text"], select, textarea { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; outline: none; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: #2563eb; }
    textarea { height: 100px; resize: none; }
    .btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .image-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; border: 1px dashed #cbd5e1; display: none; }
    .result-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-top: 8px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .badge { display: inline-block; background: #e0e7ff; color: #1d4ed8; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .loading { text-align: center; color: #2563eb; font-weight: 600; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎓 공부 가이드</h1>
      <p id="sub-header">AI 문제 풀이 + 복습 4문제 자동 출제</p>
    </div>

    <!-- 로그인 (이름 입력) 화면 -->
    <div id="screen-login" class="content">
      <div style="text-align: center; margin: 20px 0;">
        <span style="font-size: 60px;">✏️</span>
      </div>
      <div class="input-group">
        <label for="user-name">이름을 입력해 주세요</label>
        <input type="text" id="user-name" placeholder="예: 홍진수" autofocus>
      </div>
      <button class="btn" onclick="startApp()">시작하기</button>
    </div>

    <!-- 문제 풀이 화면 -->
    <div id="screen-main" class="content hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="badge" id="user-welcome">환영합니다!</span>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="logout()">로그아웃</button>
      </div>

      <div class="input-group">
        <label>학년 & 과목 선택</label>
        <div style="display: flex; gap: 8px;">
          <select id="grade">
            <option value="중학교 1학년">중학교 1학년</option>
            <option value="중학교 2학년">중학교 2학년</option>
            <option value="중학교 3학년">중학교 3학년</option>
            <option value="고등학교 1학년">고등학교 1학년</option>
            <option value="초등학교 6학년">초등학교 6학년</option>
          </select>
          <select id="subject">
            <option value="수학">수학</option>
            <option value="과학">과학</option>
            <option value="영어">영어</option>
            <option value="국어">국어</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="problem-image">📷 문제 사진 첨부 (촬영/선택)</label>
        <input type="file" id="problem-image" accept="image/*" onchange="previewImage(event)">
        <img id="image-preview" class="image-preview" alt="문제 사진 미리보기">
      </div>

      <div class="input-group">
        <label for="problem-text">📝 추가 질문 또는 문제 텍스트</label>
        <textarea id="problem-text" placeholder="문제를 직접 적거나 궁금한 점을 적어주세요."></textarea>
      </div>

      <button class="btn" onclick="solveProblem()">AI 문제 풀이 & 4문제 출제</button>

      <div id="loading" class="loading hidden">
        🤖 AI가 문제를 분석하고 해설과 복습 4문제를 만들고 있습니다...
      </div>

      <div id="result-box" class="hidden">
        <label>💡 AI 풀이 및 복습 4문제 결과</label>
        <div id="result-text" class="result-card"></div>
      </div>
    </div>
  </div>

  <script>
    const EMBEDDED_API_KEY = "AQ.Ab8RN6KikItleof_-o8Y0zWIdgq_PTN6wEYTfrbwvR8jI0phDg";
    let base64Image = null;

    window.onload = function() {
      const savedName = localStorage.getItem('study_guide_name');
      if (savedName) showMainScreen(savedName);
    };

    function startApp() {
      const nameInput = document.getElementById('user-name').value.trim();
      if (!nameInput) {
        alert('이름을 입력해 주세요.');
        return;
      }
      localStorage.setItem('study_guide_name', nameInput);
      showMainScreen(nameInput);
    }

    function showMainScreen(name) {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-main').classList.remove('hidden');
      document.getElementById('user-welcome').innerText = `${name} 학생 환영합니다!`;
    }

    function logout() {
      localStorage.removeItem('study_guide_name');
      document.getElementById('screen-main').classList.add('hidden');
      document.getElementById('screen-login').classList.remove('hidden');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('image-preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        base64Image = e.target.result.split(',');
      };
      reader.readAsDataURL(file);
    }

    async function solveProblem() {
      const grade = document.getElementById('grade').value;
      const subject = document.getElementById('subject').value;
      const problemText = document.getElementById('problem-text').value.trim();

      if (!base64Image && !problemText) {
        alert('문제 사진을 첨부하거나 텍스트를 입력해 주세요.');
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('result-box').classList.add('hidden');

      const systemPrompt = `당신은 친절한 대한민국 최고 AI 선생님입니다. 대상: ${grade} ${subject} 과정.\n\n[요청 사항]\n다음 문제 사진 또는 질문을 분석하여 아래 4개 항목을 명확히 구분하여 풀이와 문제를 작성해 주세요:\n\n1. 🎯 [정답 및 핵심 요약]\n   - 문제의 최종 정답을 명확히 제시해 주세요.\n\n2. 💡 [단계별 상세 풀이]\n   - 학생이 쉽게 이해할 수 있도록 풀이 과정을 차근차근 단계별로 설명해 주세요.\n\n3. 📌 [핵심 개념 및 공식]\n   - 이 문제를 풀 때 꼭 알아야 하는 핵심 개념, 공식, 주의할 점을 정리해 주세요.\n\n4. 📝 [복습용 유사 및 예상 문제 4문제]\n   - 이 문제와 동일한 개념을 복습할 수 있는 **유사 기출 문제 2개**와 **응용/예상 문제 2개** (총 4문제)를 새로 출제해 주세요.\n   - 각 문제 아래에는 [문제]와 [정답 및 상세 해설]을 함께 친절하게 작성해 주세요.`;

      const parts = [{ text: systemPrompt }];

      if (problemText) parts.push({ text: `질문/문제: ${problemText}` });
      if (base64Image) parts.push({ inlineData: { mimeType: "image/jpeg", data: base64Image } });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${EMBEDDED_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts }] })
        });

        const data = await response.json();
        document.getElementById('loading').classList.add('hidden');

        if (data.error) {
          alert(`오류가 발생했습니다: ${data.error.message}`);
          return;
        }

        const result = data.candidates?.[0]?.content?.parts?.[0]?.text || "풀이를 생성하지 못했습니다.";
        document.getElementById('result-text').innerText = result;
        document.getElementById('result-box').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        alert(`네트워크 오류가 발생했습니다: ${err.message}`);
      }
    }
  </script>
</body>
</html>
