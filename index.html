<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 공부 가이드</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(720px, 100%); text-align: center; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 7vw, 44px); }
    p { color: #64748b; margin-bottom: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    a { display: block; padding: 30px 18px; border-radius: 20px; color: white; text-decoration: none; font-size: 21px; font-weight: 800; box-shadow: 0 10px 24px rgba(15,23,42,.12); }
    a span { display: block; margin-top: 7px; font-size: 13px; font-weight: 500; opacity: .9; }
    .elementary { background: #16a34a; } .middle { background: #2563eb; } .high { background: #9333ea; }
  </style>
</head>
<body>
  <main>
    <h1>🎓 AI 공부 가이드</h1>
    <p>학교급을 선택하고 문제 사진을 올리세요.</p>
    <div class="cards">
      <a class="elementary" href="./초등/">초등<span>1~6학년 맞춤 풀이</span></a>
      <a class="middle" href="./중등/">중등<span>1~3학년 내신 풀이</span></a>
      <a class="high" href="./고등/">고등<span>내신·수능 맞춤 풀이</span></a>
    </div>
  </main>
</body>
</html>
