name: Deploy Study Guide Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare owner sign-in page
        run: |
          mkdir -p pages-entry
          cat > pages-entry/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 공부 가이드 · 그라치아</title><meta name="robots" content="noindex"><style>body{font:1rem/1.55 system-ui,sans-serif;margin:15vh auto;padding:1.5rem;max-width:36rem}a{color:#174b36}</style></head>
          <body><main><h1>AI 공부 가이드</h1><p>이 앱은 그라치아 홈페이지에서 소유자 계정으로 이용할 수 있습니다.</p><p><a href="https://grazia.redjinsu0419.chatgpt.site/owner-apps/study/">소유자 로그인</a></p><a href="https://grazia.redjinsu0419.chatgpt.site/apps.html">전체 앱 목록</a></main></body></html>
          HTML
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-entry

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
